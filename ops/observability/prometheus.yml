# Prometheus for the local `observability` profile.
#
# Scrapes every service's /metrics over the compose network. None of these
# endpoints are reachable from the edge (the gateway's route table has no rule
# for them), so this is the only consumer.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8000"]}]

  - job_name: backend
    static_configs: [{targets: ["backend:8000"]}]

  - job_name: worker
    # `docker compose up --scale worker=N` gives N containers behind one DNS
    # name; dns_sd discovers each replica so their metrics are not merged.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  - job_name: edge-verifier
    static_configs: [{targets: ["edge-verifier:8000"]}]

  - job_name: auth
    static_configs: [{targets: ["auth:3000"]}]
