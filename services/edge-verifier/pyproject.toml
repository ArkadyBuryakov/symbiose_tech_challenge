[project]
name = "pmp-edge-verifier"
version = "0.1.0"
description = "Local stand-in for the CloudFront signed-cookie check (deleted on AWS)."
requires-python = ">=3.12"
dependencies = [
    "pmp-common[web]",
]

[tool.uv.sources]
pmp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmp_edge_verifier"]
