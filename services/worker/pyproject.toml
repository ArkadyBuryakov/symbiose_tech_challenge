[project]
name = "pmp-worker"
version = "0.1.0"
description = "Publication worker: Kafka consumer, outbox relay, reconciler."
requires-python = ">=3.12"
dependencies = [
    "pmp-common[db,kafka,s3]",
]

[tool.uv.sources]
pmp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmp_worker"]
