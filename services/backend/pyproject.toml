[project]
name = "pmp-backend"
version = "0.1.0"
description = "Catalogue API: datasets, publications, versions, rollback, tile sessions."
requires-python = ">=3.12"
dependencies = [
    "pmp-common[web,db,kafka,s3]",
]

[tool.uv.sources]
pmp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmp_backend"]
