# Edge configuration — the local stand-in for CloudFront.
#
# Everything the browser touches arrives here: the static map pages, the API,
# the tile archives and the presigned staging uploads. No other container is
# published on the host, which mirrors the AWS topology where the distribution
# is the only public entry point.

# OpenTelemetry: the edge starts the trace, so one trace covers
# browser request -> gateway -> backend -> Kafka -> worker -> DB/S3.
load_module modules/ngx_otel_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/vnd.pmtiles pmtiles;
    }
    default_type application/octet-stream;

    # Access log with the request id, so a browser request can be followed
    # through the gateway, the backend and into the worker's logs.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"service":"edge",'
        '"request_id":"$request_id_final",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"range":"$http_range",'
        '"duration_ms":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status"'
    '}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    # Tile archives are already compressed internally; re-compressing them
    # wastes CPU and breaks nothing but the byte ranges' usefulness.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_proxied any;
    gzip_min_length 1024;

    # Docker's embedded DNS. Re-resolving keeps the edge working when a
    # container is recreated with a new address, which a statically resolved
    # `proxy_pass` would not.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    # Accept the caller's request id if it has one, otherwise mint one.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    include /etc/nginx/conf.d/*.conf;
}
