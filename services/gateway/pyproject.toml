[project]
name = "pmp-gateway"
version = "0.1.0"
description = "Edge-facing API gateway: routing, identity verification, internal JWT minting, rate limiting, streaming proxy."
requires-python = ">=3.12"
dependencies = [
    "pmp-common[web]",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
pmp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmp_gateway"]
