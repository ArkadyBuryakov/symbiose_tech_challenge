# auth and backend accept traffic only from the gateway, and the collector
# scraping /metrics (kubelet probes are always allowed). Enforced by the VPC
# CNI's network policy agent.
{{- range list "auth" "backend" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ . }}-from-gateway
spec:
  podSelector:
    matchLabels: {app: {{ . }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: gateway}
        - podSelector:
            matchLabels: {app: otel-collector}
{{- end }}
