# ADOT collector: the services' OTLP spans -> AWS X-Ray.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: "0.0.0.0:4317"}
    processors:
      batch: {}
    exporters:
      awsxray: {region: {{ .Values.region | quote }}}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [awsxray]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.50.0
          args: [--config=/conf/config.yaml]
          {{- include "pmp.securityContext" . | nindent 10 }}
          env:
            - {name: AWS_REGION, value: {{ .Values.region | quote }}}
          ports:
            - {name: otlp, containerPort: 4317}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /conf}
      volumes:
        - name: config
          configMap: {name: otel-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp, port: 4317, targetPort: otlp}
