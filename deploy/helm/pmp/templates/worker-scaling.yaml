# The worker scales on consumer lag of publication.requested: one job per pod,
# never more pods than partitions.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
spec:
  scaleTargetRef: {name: worker}
  minReplicaCount: 1
  maxReplicaCount: {{ .Values.worker.maxReplicas }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ include "pmp.kafkaBootstrap" . | quote }}
        consumerGroup: publication-worker
        topic: publication.requested
        lagThreshold: {{ .Values.worker.lagThreshold | quote }}
        # As the worker's auto.offset.reset. With KEDA's default (latest), a
        # partition with no committed offset yet counts as lag 1, so an idle
        # topic that never had a message held 6 workers.
        offsetResetPolicy: earliest
