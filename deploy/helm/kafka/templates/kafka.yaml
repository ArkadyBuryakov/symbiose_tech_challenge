# Single Redpanda broker, the same image and flags as docker-compose.yml. It
# stands in for MSK in this demo deployment (docs/aws-mapping.md).
#
# Its log lives on an EBS volume, so a rescheduled broker is still the same
# cluster. With an emptyDir it came back as a new one, which hands out producer
# ids from the start again: two clients that had kept theirs then shared one,
# and the broker dropped one's messages as the other's retries.
#
# The topics are created by a sidecar of the broker rather than once per
# release. The pod is ready, and so reachable through the Service, only once
# they exist: a client that connected to a broker without its topics would not
# look for them again for minutes.
{{- $host := printf "kafka.%s.svc.cluster.local" .Release.Namespace }}
{{- $image := "docker.redpanda.com/redpandadata/redpanda:v25.3.2" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  strategy: {type: Recreate}   # never two brokers with node-id 0
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
      annotations:
        # Scale-down must not move the only broker.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # The image runs as redpanda (101); a new volume belongs to root.
      securityContext: {fsGroup: 101}
      containers:
        - name: redpanda
          image: {{ $image }}
          args:
            - redpanda
            - start
            - --node-id=0
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --default-log-level=warn
            # LOCAL is for the topics sidecar, which must reach the broker
            # before the Service does.
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092,LOCAL://127.0.0.1:9093
            - --advertise-kafka-addr=PLAINTEXT://{{ $host }}:9092,LOCAL://127.0.0.1:9093
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr={{ $host }}:33145
            # dev-container mode turns auto-creation on; topics come from the
            # sidecar only, never with the broker's one-partition default.
            - --set
            - redpanda.auto_create_topics_enabled=false
          ports:
            - {name: kafka, containerPort: 9092}
          readinessProbe:
            exec:
              command: [sh, -c, "rpk cluster health --exit-when-healthy | grep -q 'Healthy:.*true'"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 1536Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/redpanda/data}
        # ops/kafka/kafka-init.sh, as locally; idempotent, retried until the
        # broker answers. Ready once the topics exist, which is also what the
        # release (and so the platform chart after it) waits for.
        - name: topics
          image: {{ $image }}
          command:
            - bash
            - -c
            - until bash /scripts/kafka-init.sh; do sleep 2; done; touch /tmp/ready; exec sleep infinity
          env:
            - {name: KAFKA_BROKERS, value: "127.0.0.1:9093"}
          readinessProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kafka-data}
        - name: scripts
          configMap: {name: kafka-init}
---
# Provisioned by the EBS CSI driver add-on (deploy/terraform/eks.tf). The
# volume lives in one AZ, and the broker with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp2
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: {app: kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
---
# No IAM on this broker, so this is what limits who can talk to it: the two
# services and KEDA (reads consumer lag).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-clients
spec:
  podSelector:
    matchLabels: {app: kafka}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [backend, worker]}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keda}
      ports:
        - {port: 9092}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init
data:
  kafka-init.sh: {{ .Values.kafkaInit | quote }}
