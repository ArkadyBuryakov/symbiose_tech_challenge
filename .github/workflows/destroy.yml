# Destroys everything Terraform manages in the CI state (docs/ci-cd.md).
# Runs solely from Actions -> destroy -> "Run workflow": it plans the destroy,
# and carries it out only when `apply` is ticked. Same setup as publish.yml.
name: destroy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Destroy (otherwise only show what would be destroyed)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    # Required reviewers on `prod` approve the run; the OIDC role trusts only
    # this environment's token.
    environment: prod
    # Shares publish's group, so a destroy never races a deploy for the state.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_grafana_admin_user_ids: ${{ vars.GRAFANA_ADMIN_USER_IDS || '[]' }}
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Use the S3 state backend
        run: |
          cat > backend_override.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
      - run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=pmp/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - run: terraform plan -destroy -input=false -out=tfplan
      - if: inputs.apply
        run: terraform apply -input=false tfplan
