# PMTiles publishing platform — local stack.
#
# Only the `edge` service is published on the host. Everything else talks over
# the internal compose network, which mirrors the AWS topology: CloudFront is
# the only public entry point and the services sit in private subnets.
#
#   make up                      core stack
#   make up PROFILE=observability  + prometheus/grafana/jaeger
#   make up PROFILE=debug          + direct ports for poking at internals

name: ${COMPOSE_PROJECT_NAME:-pmp}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

# Settings every Python service reads. Individual services add their own
# credentials on top of this.
x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  GIT_SHA: ${GIT_SHA:-dev}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-db-env: &db-env
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-pmtiles}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  DB_AUTH: ${DB_AUTH:-password}

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-none}
  KAFKA_TOPIC_PUBLICATION_REQUESTED: ${KAFKA_TOPIC_PUBLICATION_REQUESTED:-publication.requested}
  KAFKA_TOPIC_PUBLICATION_RESULTS: ${KAFKA_TOPIC_PUBLICATION_RESULTS:-publication.results}
  KAFKA_TOPIC_PUBLICATION_DLQ: ${KAFKA_TOPIC_PUBLICATION_DLQ:-publication.requested.dlq}

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_STAGING_BUCKET: ${S3_STAGING_BUCKET:-staging}
  S3_PUBLISH_BUCKET: ${S3_PUBLISH_BUCKET:-publish}

services:
  # =======================================================================
  # Data stores
  # =======================================================================
  postgres:
    image: postgres:16.11-alpine
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmtiles}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deterministic collation so index behaviour matches RDS.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pmtiles}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [pmp]

  kafka:
    # Redpanda: Kafka-compatible, single binary, no ZooKeeper. Stands in for
    # Amazon MSK; the clients speak plain Kafka protocol either way.
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.2
    <<: *default-restart
    logging: *default-logging
    command:
      - redpanda
      - start
      - --node-id=0
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=kafka:33145
      - --schema-registry-addr=0.0.0.0:8081
    volumes:
      - kafka-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [pmp]

  s3:
    # MinIO stands in for Amazon S3. Pulled from quay.io: the Docker Hub
    # mirror is no longer published.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    <<: *default-restart
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT: "off"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [pmp]

  # =======================================================================
  # One-shot initialisation (all idempotent; safe to re-run)
  # =======================================================================
  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.2
    logging: *default-logging
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/kafka-init.sh"]
    environment:
      KAFKA_BROKERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      TOPIC_REQUESTED: ${KAFKA_TOPIC_PUBLICATION_REQUESTED:-publication.requested}
      TOPIC_RESULTS: ${KAFKA_TOPIC_PUBLICATION_RESULTS:-publication.results}
      TOPIC_DLQ: ${KAFKA_TOPIC_PUBLICATION_DLQ:-publication.requested.dlq}
      TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-6}
    volumes:
      - ./ops/kafka:/scripts:ro
    networks: [pmp]

  s3-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    logging: *default-logging
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/s3-init.sh"]
    environment:
      S3_INTERNAL_ENDPOINT: http://s3:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      STAGING_BUCKET: ${S3_STAGING_BUCKET:-staging}
      PUBLISH_BUCKET: ${S3_PUBLISH_BUCKET:-publish}
      BACKEND_S3_ACCESS_KEY: ${BACKEND_S3_ACCESS_KEY:?}
      BACKEND_S3_SECRET_KEY: ${BACKEND_S3_SECRET_KEY:?}
      WORKER_S3_ACCESS_KEY: ${WORKER_S3_ACCESS_KEY:?}
      WORKER_S3_SECRET_KEY: ${WORKER_S3_SECRET_KEY:?}
    volumes:
      - ./ops/s3:/scripts:ro
    networks: [pmp]

  migrate:
    # Roles + schemas, Alembic for `catalog`, then least-privilege grants.
    build:
      context: .
      dockerfile: ops/migrate/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: pmp/migrate:${GIT_SHA:-dev}
    logging: *default-logging
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*common-env, *db-env]
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?}
    networks: [pmp]

  # =======================================================================
  # Application services
  # =======================================================================
  auth:
    build:
      context: ./services/auth
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: pmp/auth:${GIT_SHA:-dev}
    <<: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      HTTP_PORT: "3000"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pmtiles}
      DB_USER: auth_svc
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_SCHEMA: auth
      BETTER_AUTH_SECRET_PATH: /run/keys/better-auth.secret
    volumes:
      - ./dev-keys:/run/keys:ro
    networks: [pmp]

  backend:
    build:
      context: .
      dockerfile: ops/docker/python.Dockerfile
      args:
        PACKAGE: pmp-backend
        SERVICE_DIR: services/backend
        MODULE: pmp_backend
        HEALTH_PORT: "8000"
        GIT_SHA: ${GIT_SHA:-dev}
    image: pmp/backend:${GIT_SHA:-dev}
    <<: *default-restart
    logging: *default-logging
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      s3: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
      s3-init: {condition: service_completed_successfully}
    environment:
      <<: [*common-env, *db-env, *kafka-env, *s3-env]
      HTTP_PORT: "8000"
      DB_USER: backend_svc
      DB_PASSWORD: ${BACKEND_DB_PASSWORD:?}
      S3_ACCESS_KEY_ID: ${BACKEND_S3_ACCESS_KEY:?}
      S3_SECRET_ACCESS_KEY: ${BACKEND_S3_SECRET_KEY:?}
      BACKEND_AUTH_MODE: ${BACKEND_AUTH_MODE:-internal_jwt}
      BACKEND_DEV_USER_ID: ${BACKEND_DEV_USER_ID:-dev-user}
      BACKEND_DEV_TENANT_ID: ${BACKEND_DEV_TENANT_ID:-dev-tenant}
      INTERNAL_JWT_PUBLIC_KEY_PATH: /run/keys/internal-jwt.pub
      DEMO_UPLOAD_ENABLED: ${DEMO_UPLOAD_ENABLED:-false}
      CLOUDFRONT_PRIVATE_KEY_PATH: /run/keys/cloudfront.key
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-LOCALKEYPAIRID}
      TILE_COOKIE_TTL_SECONDS: ${TILE_COOKIE_TTL_SECONDS:-600}
    volumes:
      - ./dev-keys:/run/keys:ro
    networks: [pmp]

  # =======================================================================
  # Developer UIs
  # =======================================================================
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v3.5.0
    <<: *default-restart
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_LISTENPORT: "8080"
    ports:
      - "127.0.0.1:${KAFKA_CONSOLE_PORT:-8081}:8080"
    networks: [pmp]


volumes:
  postgres-data:
  kafka-data:
  s3-data:

networks:
  pmp:
    name: ${COMPOSE_PROJECT_NAME:-pmp}-net
    driver: bridge
